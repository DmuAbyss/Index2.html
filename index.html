<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniela Breniz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    background:linear-gradient(160deg,#ff2e63 0%,#c724b1 45%,#6a0dad 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .cover{
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
    background:linear-gradient(135deg,#ff2e63,#6a0dad);
  }
  .content{
    padding:0 28px 32px;
  }
  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    margin:-48px auto 12px;
    object-fit:cover;
    display:block;
    border:4px solid #fff;
    box-shadow:0 0 0 3px #ff2e63;
    background:#eee;
  }
  h1{
    font-size:22px;
    font-weight:800;
    color:#1a1a1a;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
    background:#ffe4ec;
    color:#ff2e63;
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
  }
  p.bio{
    margin-top:14px;
    color:#555;
    font-size:14px;
    line-height:1.5;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-top:20px;
    padding:16px 0;
    border-top:1px solid #f0f0f0;
    border-bottom:1px solid #f0f0f0;
  }
  .stat{ text-align:center; }
  .stat b{ display:block; font-size:16px; color:#1a1a1a; }
  .stat span{ font-size:11px; color:#999; }
  .cta{
    display:block;
    margin-top:24px;
    background:linear-gradient(135deg,#ff2e63,#c724b1);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:16px;
    border-radius:14px;
    box-shadow:0 10px 24px rgba(255,46,99,0.4);
    transition:transform .2s ease;
  }
  .cta:active{ transform:scale(0.97); }
  .note{
    margin-top:14px;
    font-size:11px;
    color:#aaa;
  }
</style>
</head>
<body>
<div class="card">
  <img class="cover" src="capa.jpg" alt="capa">
  <img class="avatar" src="foto.jpg" alt="Daniela Breniz">
  <div class="content">
  <h1>Daniela Breniz</h1>
  <div class="badge">🔒 Conteúdo Exclusivo</div>
  <p class="bio">Uma Gótica que ama te deixar louco😈<br>Aqui você vai encontrar meu lado mais obscuro🤭❤️‍🔥</p>
  <div class="stats">
    <div class="stat"><b>+1200</b><span>fotos e vídeos</span></div>
    <div class="stat"><b>Diária</b><span>lives privadas</span></div>
    <div class="stat"><b>Mensal</b><span>rifa exclusiva</span></div>
  </div>
  <a class="cta" href="https://t.me/+UesbadYN-GM0NmFh" target="_blank" rel="noopener">Acessar conteúdo no Telegram</a>
  <div class="note">acesso imediato após entrar</div>
  </div>
</div>
</body>
</html>
